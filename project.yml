name: SynoLink
options:
  bundleIdPrefix: com.zhoujianxiang
  xcodeVersion: "16.0"
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

targets:
  SynoLink:
    type: application
    platform: iOS
    sources:
      - path: SynoLink
        excludes:
          - "**/.DS_Store"
    resources:
      - path: SynoLink/Resources
        optional: true
    info:
      path: SynoLink/Info.plist
      properties:
        CFBundleDisplayName: SynoLink
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zjx2026.synolink-nas
        DEVELOPMENT_TEAM: 26D435TDFY
        INFOPLIST_FILE: SynoLink/Info.plist
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: false
